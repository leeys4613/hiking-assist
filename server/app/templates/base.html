<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f5e3d">
<title>{% block title %}등산 어시스턴트{% endblock %}</title>
<style>
  /* 디자인 토큰: 앱 아이콘 팔레트(숲 녹색 / 민트 / 크림 / 앰버)에서 파생. 안드로이드 테마와 같은 값을 쓴다 */
  :root {
    --bg:#f7f4ea; --fg:#18271f; --mut:#5d6b62; --card:#fffdf8; --line:#e4dfcc;
    --acc:#1f5e3d; --acc-fg:#fff; --acc-soft:#e3efe6; --amber:#f2a93b; --amber-fg:#3a2700;
    --r-card:16px; --r-ctl:12px; --shadow:0 1px 2px rgba(24,39,31,.06), 0 4px 14px rgba(24,39,31,.05);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0f1713; --fg:#e8efe9; --mut:#94a39a; --card:#16201a; --line:#25322a;
    --acc:#8fc7a2; --acc-fg:#0e1a13; --acc-soft:#1d2d24; --amber:#f2a93b; --amber-fg:#2a1c00;
    --shadow:none;
  } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 "Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 40px; }
  a { color: var(--acc); }
  h1 { font-size: 1.5rem; font-weight:700; letter-spacing:-.02em; margin: .8rem 0 1rem; }
  h2 { font-size: 1.1rem; font-weight:700; margin: 1.6rem 0 .6rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); box-shadow:var(--shadow); padding:16px 18px; margin:12px 0; display:block; text-decoration:none; color:inherit; }
  a.card:active { transform:scale(.99); }
  .mut { color: var(--mut); font-size:.9rem; }
  .badge { display:inline-block; background:var(--acc-soft); color:var(--acc); border-radius:999px; padding:.1em .7em; font-size:.78rem; font-weight:600; margin-left:.5em; vertical-align:middle; }
  .stats { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:var(--r-ctl); padding:8px 14px; min-width:84px; }
  .stat b { display:block; font-size:1.2rem; font-weight:700; letter-spacing:-.01em; }
  .stat span { color:var(--mut); font-size:.78rem; }
  .stat.sun b { color:var(--amber); }
  table { width:100%; border-collapse: collapse; font-size:.92rem; }
  th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:600; font-size:.8rem; }
  button, .btn { background:var(--acc); color:var(--acc-fg); border:0; border-radius:var(--r-ctl); padding:.8em 1.3em; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  #map { height: 55vh; min-height: 320px; border-radius:var(--r-card); border:1px solid var(--line); }
  input { font-size:1rem; padding:.7em .8em; border:1px solid var(--line); border-radius:var(--r-ctl); background:var(--card); color:var(--fg); width:100%; }
  nav { padding:4px 0; }
  nav a { margin-right: 1rem; text-decoration:none; font-weight:600; }
</style>
</head>
<body><main>
<nav><a href="/">산 목록</a></nav>
{% block body %}{% endblock %}
</main></body>
</html>
